<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scooter Pages — Sidebar Dynamic Loading</title>
  <link rel="stylesheet" href="../components.css" />
  <link rel="stylesheet" href="../components/custom/monaco-editor/style.css" />
  <link rel="stylesheet" href="../components/custom/div-table/div-table.css" />
  <link rel="stylesheet" href="demo.css" />
  <style>
    /* Full-viewport sidebar layout */
    html, body { margin: 0; height: 100%; overflow: hidden; }

    [data-sc="sidebar"] {
      display: flex;
      height: 100vh;
    }

    [data-slot="sidebar-panel"] {
      width: 240px;
      min-width: 240px;
      background: var(--secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    [data-sc="sidebar"][data-state="collapsed"] [data-slot="sidebar-panel"] {
      width: 0;
      min-width: 0;
      overflow: hidden;
      border-right: none;
    }

    [data-slot="sidebar-header"] {
      padding: 16px 20px;
      font-weight: 600;
      font-size: var(--text-title2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    [data-slot="sidebar-group-label"] {
      padding: 12px 20px 4px;
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    [data-slot="sidebar-group-content"] {
      list-style: none;
      margin: 0;
      padding: 4px 8px;
    }

    [data-slot="sidebar-menu-button"] {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: none;
      background: none;
      border-radius: var(--radius-sm);
      font-size: var(--text-callout);
      color: var(--foreground);
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-fast);
    }
    [data-slot="sidebar-menu-button"]:hover {
      background: var(--accent);
    }
    [data-slot="sidebar-menu-button"][data-active="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    [data-slot="sidebar-footer"] {
      margin-top: auto;
      padding: 12px 20px;
      font-size: var(--text-footnote);
      color: var(--muted-foreground);
      border-top: 1px solid var(--border);
    }

    [data-slot="sidebar-inset"] {
      flex: 1;
      overflow-y: auto;
      background: var(--background);
      padding: 10px;
    }

    .sidebar-trigger-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius-sm);
      color: var(--muted-foreground);
    }
    .sidebar-trigger-btn:hover {
      background: var(--accent);
      color: var(--foreground);
    }

    /* Show panel collapse button only when sidebar is open */
    [data-sc="sidebar"][data-state="collapsed"] .sidebar-header-toggle { display: none; }
    /* Hide entire inset header bar when sidebar is expanded (sidebar-header suffices) */
    [data-sc="sidebar"][data-state="expanded"] .inset-header { display: none; }

    /* ── Sidebar hover trigger (visible when sidebar collapsed) ── */
    .sidebar-hover-trigger {
      position: absolute;
      left: 0;
      top: 0;
      width: 6px;
      height: 100%;
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 200ms ease, background 200ms ease, box-shadow 200ms ease;
    }
    .sidebar-hover-trigger .trigger-icon {
      opacity: 0;
      transition: opacity 200ms ease;
      color: var(--muted-foreground);
      flex-shrink: 0;
    }
    .sidebar-hover-trigger:hover {
      width: 36px;
      background: var(--secondary);
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(0,0,0,0.06));
    }
    .sidebar-hover-trigger:hover .trigger-icon {
      opacity: 1;
    }
    /* Only show when sidebar is collapsed */
    [data-sc="sidebar"][data-state="expanded"] .sidebar-hover-trigger { display: none; }
    [data-sc="sidebar"][data-state="collapsed"] .sidebar-hover-trigger { display: flex; }

    /* Inset header bar with toggle (visible only when sidebar collapsed) */
    .inset-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--background);
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    .inset-header h1 {
      font-size: var(--text-body);
      font-weight: 600;
      margin: 0;
    }

    /* Brand + title hidden until user scrolls */
    .inset-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: var(--text-callout, 14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .inset-separator {
      color: var(--muted-foreground);
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .inset-header:not(.is-scrolled) #inset-title {
      opacity: 0;
      pointer-events: none;
    }
    #inset-title { transition: opacity 200ms ease; }
    .inset-header.is-scrolled .inset-brand,
    .inset-header.is-scrolled .inset-separator { opacity: 1; pointer-events: auto; }

    /* Sticky h1 inside loaded content — styled like sidebar-header */
    #inset-body > h1,
    #inset-body > .header {
      position: sticky;
      top: 0;
      background: var(--secondary);
      z-index: 4;
      padding: 10px 16px;
      margin: 0 -10px 0.5rem;
      font-size: var(--text-callout, 14px);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    /* Sticky h2 section headers below h1 — smaller content-header */
    #inset-body .demo-section > h2 {
      position: sticky;
      top: 40px;
      background: var(--secondary);
      z-index: 3;
      padding: 8px 16px;
      margin: 0 -10px 0.5rem;
      font-size: var(--text-footnote, 12px);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* When sidebar collapsed the inset-header is visible (~41px), push sticky headings below it */
    [data-sc="sidebar"][data-state="collapsed"] #inset-body > h1,
    [data-sc="sidebar"][data-state="collapsed"] #inset-body > .header {
      top: 41px;
    }
    [data-sc="sidebar"][data-state="collapsed"] #inset-body .demo-section > h2 {
      top: 81px;
    }

    /* Shadow appears only when stuck */
    #inset-body > h1,
    #inset-body > .header,
    #inset-body .demo-section > h2 {
      transition: box-shadow 200ms;
      box-shadow: none;
    }
    #inset-body .is-stuck {
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    /* Loading indicator */
    .loading-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted-foreground);
      font-size: var(--text-body);
    }

    /* ── Dashboard styles (for dynamically loaded dashboard page) ── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .chart-row { grid-template-columns: 1fr; }
    }
    .chart-row-3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .chart-row-3 { grid-template-columns: 1fr; }
    }
    .stat-value {
      font-size: var(--text-title1);
      font-weight: 700;
      color: var(--foreground);
      margin: 4px 0;
    }
    .stat-change {
      font-size: var(--text-footnote);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--destructive); }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .period-toggle {
      display: inline-flex;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--muted);
    }
    .period-toggle button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }
    .period-toggle button[aria-pressed="true"] {
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .period-toggle button:hover:not([aria-pressed="true"]) {
      color: var(--foreground);
    }
    [data-sc="chart"] { width: 100%; }

    /* Welcome state */
    .welcome-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--muted-foreground);
    }
    .welcome-state h2 {
      color: var(--foreground);
      font-size: var(--text-title1);
    }
  </style>
</head>

<!-- Toggle helper used by dynamically loaded demo pages (Show HTML / Show JS buttons) -->
<script>
function toggleCode(btn, cls) {
  var card = btn.closest('.demo-card');
  var block = card.querySelector(cls);
  if (!block) return;
  var expanded = btn.getAttribute('aria-expanded') === 'true' ? 'false' : 'true';
  btn.setAttribute('aria-expanded', expanded);
  block.dataset.visible = expanded;
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const insetBody = document.getElementById('inset-body');
  const insetTitle = document.getElementById('inset-title');
  const navButtons = document.querySelectorAll('[data-slot="sidebar-menu-button"][data-page]');
  let currentPage = null;

  // Start observing DOM for auto-init of new Scooter components
  Scooter.observe();

  const scrollContainer = document.getElementById('main-content');
  const insetHeader = document.querySelector('.inset-header');

  // Toggle .is-scrolled on the inset header when the user scrolls
  scrollContainer.addEventListener('scroll', () => {
    insetHeader.classList.toggle('is-scrolled', scrollContainer.scrollTop > 0);
  });

  function initStickyObservers() {
    // Insert 1px sentinel elements before each sticky heading.
    // When a sentinel scrolls out of view, its heading is stuck.
    const stickyEls = insetBody.querySelectorAll(':scope > h1, :scope > .header, .demo-section > h2');
    stickyEls.forEach(el => {
      const sentinel = document.createElement('div');
      sentinel.className = 'sticky-sentinel';
      sentinel.style.cssText = 'height:1px;margin:0;padding:0;visibility:hidden;pointer-events:none;';
      el.parentNode.insertBefore(sentinel, el);

      const observer = new IntersectionObserver(
        ([entry]) => { el.classList.toggle('is-stuck', !entry.isIntersecting); },
        { root: scrollContainer, threshold: 0 }
      );
      observer.observe(sentinel);
    });
  }

  navButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const page = btn.getAttribute('data-page');
      if (page === currentPage) return;

      // Update active state
      navButtons.forEach(b => b.removeAttribute('data-active'));
      btn.setAttribute('data-active', 'true');

      loadPage(page, btn.textContent.trim());
    });
  });

  function loadPage(page, title) {
    currentPage = page;
    if (insetTitle) insetTitle.textContent = title || 'Scooter Pages';
    insetBody.innerHTML = '<div class="loading-placeholder">Loading…</div>';

    PageLoader.load(page, insetBody)
      .then(function (result) {
        if (result.title && insetTitle) insetTitle.textContent = result.title;
        initStickyObservers();
      })
      .catch(function (err) {
        insetBody.innerHTML =
          '<div class="loading-placeholder" style="color:var(--destructive)">' +
            'Error: ' + err.message +
          '</div>';
      });
  }
});
</script>
